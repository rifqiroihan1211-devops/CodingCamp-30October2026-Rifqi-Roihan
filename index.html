<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Productivity Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="top-bar">
    <div id="greeting-section">
      <h1 id="greeting-text">Good Morning!</h1>
      <p id="datetime-text"></p>
    </div>
    <div class="top-controls">
      <!-- Custom name input -->
      <div class="name-control">
        <input type="text" id="username-input" placeholder="Enter your name..." maxlength="30" />
        <button id="save-name-btn">Save</button>
      </div>
      <!-- Dark/Light mode toggle -->
      <button id="theme-toggle" title="Toggle Dark/Light Mode">🌙</button>
    </div>
  </header>

  <!-- ===== MAIN LAYOUT ===== -->
  <main class="dashboard">

    <!-- LEFT COLUMN: Focus Timer -->
    <section class="card" id="timer-section">
      <h2>⏱ Focus Timer</h2>

      <!-- Pomodoro duration setting (Challenge: Change Pomodoro time) -->
      <div class="timer-settings">
        <label for="pomodoro-duration">Duration (min):</label>
        <input type="number" id="pomodoro-duration" min="1" max="120" value="25" />
        <button id="apply-duration-btn">Apply</button>
      </div>

      <div id="timer-display" class="timer-display">25:00</div>
      <div class="timer-progress-wrap">
        <div class="timer-progress-bg">
          <div id="timer-progress-bar" class="timer-progress-bar"></div>
        </div>
      </div>

      <div class="timer-controls">
        <button id="start-btn" class="btn-primary">▶ Start</button>
        <button id="stop-btn" class="btn-secondary">⏸ Pause</button>
        <button id="reset-btn" class="btn-danger">↺ Reset</button>
      </div>

      <p id="timer-status" class="timer-status">Ready to focus!</p>
    </section>

    <!-- MIDDLE COLUMN: To-Do List -->
    <section class="card" id="todo-section">
      <h2>✅ To-Do List</h2>

      <div class="todo-input-wrap">
        <input type="text" id="todo-input" placeholder="Add a new task..." maxlength="100" />
        <button id="todo-add-btn" class="btn-primary">Add</button>
      </div>

      <!-- Sort control (Challenge: Sort tasks) -->
      <div class="todo-sort-wrap">
        <label for="sort-select">Sort:</label>
        <select id="sort-select">
          <option value="default">Default</option>
          <option value="az">A → Z</option>
          <option value="za">Z → A</option>
          <option value="done">Done last</option>
          <option value="undone">Done first</option>
        </select>
      </div>

      <ul id="todo-list" class="todo-list"></ul>
      <p id="todo-empty" class="empty-msg">No tasks yet. Add one above!</p>
    </section>

    <!-- RIGHT COLUMN: Quick Links -->
    <section class="card" id="links-section">
      <h2>🔗 Quick Links</h2>

      <div class="link-input-wrap">
        <input type="text" id="link-name-input" placeholder="Site name" maxlength="30" />
        <input type="url" id="link-url-input" placeholder="https://..." maxlength="200" />
        <button id="link-add-btn" class="btn-primary">Add</button>
      </div>

      <div id="links-grid" class="links-grid"></div>
      <p id="links-empty" class="empty-msg">No links yet. Add your favorites!</p>
    </section>

  </main>

  <footer class="footer">
    <p>Built with ❤️ using HTML, CSS &amp; Vanilla JS &nbsp;|&nbsp; Data saved in your browser</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
